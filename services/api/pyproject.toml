[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanner-api"
version = "0.1.0"
description = "TheScanner platform: signed-read ingest, watch-list screening, investigation search, retention and erasure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "nepal-plate",
  "scanner-evidence",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
scanner-api = "scanner_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scanner_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
