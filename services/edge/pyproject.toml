[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanner-edge"
version = "0.1.0"
description = "TheScanner edge agent: camera to signed, queued plate reads with zone entry/exit sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "nepal-plate",
  "scanner-models",
  "numpy>=1.24",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
  "cryptography>=42.0",
  "onnxruntime>=1.17",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Jetson images install onnxruntime-gpu separately; it is not on PyPI for ARM.
jetson = []

[project.scripts]
scanner-edge = "scanner_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scanner_edge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
