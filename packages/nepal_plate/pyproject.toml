[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nepal-plate"
version = "0.1.0"
description = "Domain core for Nepali vehicle registration plates: reference data, layout grammars, grammar-constrained decoding and multi-frame fusion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TheScanner contributors" }]
keywords = ["anpr", "alpr", "nepal", "licence-plate", "devanagari", "ctc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
# Deliberately zero runtime dependencies: this package is imported by the edge
# agent, the trainer, the API and the synthetic renderer, and must never drag a
# deep-learning runtime into any of them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["nepal_plate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
