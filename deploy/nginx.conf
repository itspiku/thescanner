server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No external requests: the console loads nothing from a CDN, a font host
    # or a map provider, so the policy can be this tight. connect-src is
    # self-only because the API is proxied under the same origin below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The API writes client_ip into the access log, so the real address has
        # to survive the proxy or every audit entry records the container's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Blob uploads from nodes can be large.
        client_max_body_size 32m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
